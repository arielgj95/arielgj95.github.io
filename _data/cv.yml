    - name: Bio
      value: Postdoctoral Researcher at the Italian Institute of Technology (IIT), working on multimodal generative learning,
        room acoustics, and spatial audio. My research spans few-shot room impulse response generation, audio-visual scene modeling,
        human motion generation, and speaker-independent culture modeling. First author of SICAGE, published at ECCV 2026.
- title: Work Experience
  type: time_table
  contents:
    - title: Postdoctoral Researcher
      institution: Italian Institute of Technology (IIT)
      year: 2025-02-17 - Present
      description:
        - Developing FACT-RIR, an ongoing research project on few-shot room impulse response generation from observed acoustics,
          source/receiver geometry, and visual evidence.
        - Designing latent audio models with neural codecs and conditional flow matching; studying room-level and query-dependent
          representations and physics-informed acoustic conditioning.
        - Building reproducible training and evaluation pipelines with controlled ablations, room-disjoint validation, and multi-seed
          comparisons on HPC resources using SLURM and multi-GPU training.
        - Built a 3D sound-source localization pipeline mapped onto room point clouds using MVDR, DAS, and MaxRE beamforming.
        - Curating multimodal spatial-audio data and writing a survey on learning-based spatial audio rendering.
    - title: PhD Researcher
      institution: University of Genoa; research collaboration with King's College London
      year: 2021-11 - 2025-05
      description:
        - "First author of SICAGE: Speaker-Independent Culture-Aware Gesture Generation using TED4C-L Dataset, published in the
          ECCV 2026 main conference proceedings."
        - Built TED4C-L, a multimodal dataset with 106.45 hours from 764 speakers across four cultural groups.
        - Designed ALaDiT, a diffusion-transformer model for culture-aware co-speech motion generation.
        - Learned speaker-independent culture embeddings with Fishr regularization and adversarial learning; analyzed cultural
          patterns with MLPs, SVMs, Random Forests, and VQ-VAEs.
        - Developed semantic-similarity algorithms for symbolic and deictic gesture labeling.
    - title: Software Engineer
      institution: AKKA Technologies
      year: 2021-05 - 2021-10
      description:
        - Delivered and presented a working demo to stakeholders.
