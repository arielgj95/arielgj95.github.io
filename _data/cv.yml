- title: Research Projects
  type: time_table
  contents:
    - title: "FACT-RIR: Few-shot Room Impulse Response Generation (ongoing research)"
      institution: A unified pipeline for few-shot room impulse response generation from sparse acoustics, geometry, and visual
        evidence.
      description:
        - Combines neural audio codecs and conditional flow matching in a single latent-space RIR synthesis pipeline.
        - Investigates room-level and query-dependent acoustic representations, decay conditioning, and physics-informed modeling.
