- title: Research Projects
  type: time_table
  contents:
    - title: "FACT-RIR: Few-shot Room Impulse Response Generation (ongoing research)"
      institution: Learning room acoustics from sparse observations, geometry, and visual evidence for spatial audio synthesis.
      description:
        - Neural audio codecs and conditional flow matching for RIR generation.
        - Room-level and query-dependent acoustic representations, decay conditioning, and controlled factorization studies.
        - Reproducible data pipelines, acoustic metrics, matched baselines, and multi-seed evaluation.
