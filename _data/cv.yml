    - name: Bio
      value: Postdoctoral researcher with a PhD in Artificial Intelligence and Robotics. Develops multimodal generative
        models for human motion and spatial audio, combining diffusion transformers, representation learning, dataset
        development, and experimental evaluation in Python and PyTorch.
- title: Professional Experience
  type: time_table
  contents:
    - title: Postdoctoral Researcher
      institution: Italian Institute of Technology (IIT)
      year: 2025-02-17 - Present
      description:
        - Multimodal learning and spatial audio for immersive environments in the European XTREME project.
        - Developing few-shot room impulse response generation from audio and depth, with counterfactual training for
          reverberation control (ongoing research).
        - Built Eigenmike 64 processing pipelines for beamforming, binaural rendering, and acoustic mapping on 3D room
          point clouds.
        - Implemented audio/video synchronization and 360-degree acoustic overlays for spatial-audio recordings.
    - title: PhD Researcher
      institution: University of Genoa
      year: 2021-11 - 2025-05
      description:
        - Research on multimodal human motion generation and domain generalization, including a research collaboration
          with King's College London.
        - Designed ALaDiT, a multimodal diffusion transformer generating 4 s of 3D motion in <14 ms on a single RTX 3090
          (SICAGE, ECCV 2026).
        - "Created and released TED4C-L: 106.45 hours from 764 speakers, aligning MMPose-extracted motion with audio and text."
        - Analyzed cultural cues in interaction and affective data using classical and deep learning models (AIRO 2022;
          AHRI at ACII 2024).
        - Learned cultural representations with Fishr and adversarial domain generalization, using speaker-disjoint training
          and evaluation.
        - Benchmarked generative models with controlled ablations; released training and evaluation code.
        - Developed semantic-similarity algorithms for symbolic and deictic gesture labeling (IEEE RO-MAN 2024).
    - title: Software Engineer
      institution: AKKA Technologies
      year: 2021-05 - 2021-10
      description:
        - Developed Python backend software for aircraft panels and presented a working demo to stakeholders.
